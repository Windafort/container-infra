apiVersion: v1
kind: Pod
metadata:
  labels:
    app: anythingllm
  name: anythingllm-pod
spec:
  containers:
    - name: anythingllm
      image: docker.io/mintplexlabs/anythingllm:${IMAGE_VERSION}
      env:
        - name: HOST_PORT
          value: "3001"
        - name: DISABLE_TELEMETRY
          value: ${DISABLE_TELEMETRY}
        - name: DISABLE_ANALYTICS
          value: ${DISABLE_ANALYTICS}
      ports:
        - containerPort: 3001
          hostPort: ${PORT}
          protocol: TCP
      volumeMounts:
        - mountPath: /usr/app/.data
          name: anythingllm-data

  volumes:
    - name: anythingllm-data
      persistentVolumeClaim:
        claimName: anythingllm-data-pvc
